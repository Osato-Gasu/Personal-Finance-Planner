name: Governance CI

on:
  push:
    branches-ignore:
      - "no-ci/**"
  pull_request:
  workflow_dispatch:
    inputs:
      candidate_sha:
        description: "Full commit SHA to validate"
        required: true
        type: string

permissions:
  contents: read

jobs:
  governance:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Exact candidate SHA guard
        if: github.event_name == 'workflow_dispatch'
        shell: pwsh
        env:
          CANDIDATE_SHA: ${{ inputs.candidate_sha }}
        run: |
          $candidate = [string]$env:CANDIDATE_SHA
          if ($candidate -notmatch '^[0-9a-fA-F]{40}$' -or $candidate -match '^0+$') { throw 'candidate_sha must be a non-zero full Git SHA' }
          $head_sha = (git rev-parse HEAD).Trim()
          if ($head_sha -cne $candidate) { throw "workflow head $head_sha does not equal candidate_sha $candidate" }
      - name: Validate TASK-001 candidate boundary
        if: github.ref == 'refs/heads/codex/task-001-shared-governance-adoption' || github.head_ref == 'codex/task-001-shared-governance-adoption'
        shell: pwsh
        run: ./tools/validate-task-001-boundary.ps1
      - name: Validate governance (PowerShell 7)
        shell: pwsh
        run: ./tools/validate-ai-governance.ps1
      - name: Test governance contract (PowerShell 7)
        shell: pwsh
        run: ./tools/test-governance-contract.ps1
      - name: Test TASK HTML contract (PowerShell 7)
        shell: pwsh
        run: ./tools/test-task-html-contract.ps1
      - name: Test Shared2 bootstrap smoke (PowerShell 7)
        shell: pwsh
        run: ./tools/test-shared2-bootstrap-smoke.ps1
      - name: Test SharedSync contract (PowerShell 7)
        shell: pwsh
        run: ./tools/test-shared-sync-contract.ps1
      - name: Validate governance (PowerShell 5.1)
        shell: powershell
        run: ./tools/validate-ai-governance.ps1
      - name: Test governance contract (PowerShell 5.1)
        shell: powershell
        run: ./tools/test-governance-contract.ps1
      - name: Test TASK HTML contract (PowerShell 5.1)
        shell: powershell
        run: ./tools/test-task-html-contract.ps1
      - name: Test Shared2 bootstrap smoke (PowerShell 5.1)
        shell: powershell
        run: ./tools/test-shared2-bootstrap-smoke.ps1
      - name: Test SharedSync contract (PowerShell 5.1)
        shell: powershell
        run: ./tools/test-shared-sync-contract.ps1
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Lint
        run: npm run lint
      - name: Check formatting
        run: npm run format:check
      - name: Test
        run: npm run test
      - name: Validate fixed 2026 rule package
        run: npm run test:rules
      - name: Validate adult NISA rule package and state safety
        run: npm run test:nisa
      - name: Validate iDeCo rule package, linked tax source, and state safety
        run: npm run test:ideco
      - name: Validate integrated overview source selection and state safety
        run: npm run test:overview
      - name: Build
        run: npm run build:app
      - name: Verify committed root launcher freshness
        run: node tools/sync-root-launcher.mjs --check
      - name: Test completion automation (PowerShell 7)
        shell: pwsh
        run: ./tools/test-complete-task-local.ps1
      - name: Test completion automation (PowerShell 5.1)
        shell: powershell
        run: ./tools/test-complete-task-local.ps1
      - name: Test standalone file build
        run: npm run test:portable
