name: Governance CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  governance:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Validate Shared 2 Project governance (PowerShell 7)
        shell: pwsh
        run: ./tools/validate-ai-governance.ps1
      - name: Smoke test Shared 2 explicit TASK start (PowerShell 7)
        shell: pwsh
        run: ./tools/test-shared2-task-start.ps1
      - name: Validate Shared 2 Project governance (PowerShell 5.1)
        shell: powershell
        run: ./tools/validate-ai-governance.ps1
      - name: Smoke test Shared 2 explicit TASK start (PowerShell 5.1)
        shell: powershell
        run: ./tools/test-shared2-task-start.ps1
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Lint
        run: npm run lint
      - name: Check formatting
        run: npm run format:check
      - name: Test
        run: npm run test
      - name: Validate fixed 2026 rule package
        run: npm run test:rules
      - name: Validate adult NISA rule package and state safety
        run: npm run test:nisa
      - name: Validate iDeCo rule package, linked tax source, and state safety
        run: npm run test:ideco
      - name: Validate integrated overview source selection and state safety
        run: npm run test:overview
      - name: Build
        run: npm run build:app
      - name: Verify committed root launcher freshness
        run: node tools/sync-root-launcher.mjs --check
      - name: Test completion automation (PowerShell 7)
        shell: pwsh
        run: ./tools/test-complete-task-local.ps1
      - name: Test completion automation (PowerShell 5.1)
        shell: powershell
        run: ./tools/test-complete-task-local.ps1
      - name: Test standalone file build
        run: npm run test:portable
